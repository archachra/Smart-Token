services:
  - type: web
    name: smart-token
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: smarttoken-uploads
      mountPath: /app/server/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: smarttoken-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: smarttoken-db
    databaseName: smarttoken_db
    user: smarttoken
    plan: free
